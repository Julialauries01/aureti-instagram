<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8">
<link rel="stylesheet" href="base.css">
<style>
  /* Still cards for the showreel: #intro or #fim is shown depending on the URL hash */
  .card-full { position: absolute; inset: 0; display: none; }
  :target { display: flex; }
  #intro .h { font-size: 120px; }
  #intro p.k { font-size: 26px; font-weight: 600; letter-spacing: .3em; text-transform: uppercase; color: var(--gold-soft); margin-bottom: 30px; }
</style></head>
<body>
  <div id="intro" class="card-full navy center">
    <p class="k">Showreel · Aureti</p>
    <p class="h">Um mês de<br><em>projetos</em><br>em 20 segundos.</p>
  </div>
  <div id="fim" class="card-full navy center end">
    <p class="logo">aureti<small>ENGENHARIA DE SOFTWARE</small></p>
    <p class="lead" style="margin-top:50px">Sites, lojas, sistemas e apps.</p>
    <p class="handle">@aure.tii</p>
    <p class="cta">Comente SITE e receba um orçamento</p>
  </div>
</body></html>

<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8">
<link rel="stylesheet" href="base.css">
<script src="motion.js"></script>
<style>
  /* Style: kinetic typography — one word per beat, hard cuts between navy/ivory/gold, iris wipes, project mosaic */
  .beat { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; }
  .beat p { font-size: 200px; font-weight: 600; letter-spacing: -.05em; }
  #b0 { background: var(--navy); } #b0 p { font-size: 110px; font-weight: 300; letter-spacing: -.02em; }
  #b0 p i { font-style: normal; color: var(--gold-soft); font-weight: 500; }
  #b1 { background: var(--ivory); color: var(--navy); }
  #b2 { background: var(--gold-soft); color: var(--navy); }
  #b3 { background: var(--navy); color: var(--ivory); }
  #b4 { background: var(--ivory); color: var(--navy); }
  #bar { position: absolute; left: 90px; right: 90px; top: 1180px; height: 6px; background: var(--gold); transform-origin: 0 50%; }
  #wall { background: var(--navy); }
  .tile { position: absolute; width: 440px; height: 550px; border-radius: 26px; overflow: hidden; box-shadow: 0 30px 70px rgba(0,0,0,.45); }
  .tile img { width: 100%; height: 100%; object-fit: cover; }
  #wallt { position: absolute; left: 0; right: 0; top: 200px; text-align: center; z-index: 2; text-shadow: 0 6px 30px rgba(0,0,0,.6); }
  #end { background: var(--navy); }
  #follow { margin-top: 60px; padding: 26px 70px; border-radius: 16px; background: #4f5bd5; color: #fff; font-size: 36px; font-weight: 600; }
  #cursor { position: absolute; left: 640px; top: 1500px; width: 70px; height: 70px; border-radius: 50%; background: rgba(255,255,255,.75); border: 3px solid #fff; }
</style></head>
<body><div class="stage">
  <div id="b0" class="beat"><p>Olá, somos a <i>Aureti.</i></p></div>
  <div id="b1" class="beat"><p>Sites.</p></div>
  <div id="b2" class="beat"><p>Lojas.</p></div>
  <div id="b3" class="beat"><p>Sistemas.</p></div>
  <div id="b4" class="beat"><p>Apps.</p></div>
  <div id="bar"></div>
  <div id="wall" class="layer">
    <p id="wallt" class="h">Projetos que<br><em>já estão no ar.</em></p>
  </div>
  <div id="end" class="layer center end">
    <p class="logo">aureti<small>ENGENHARIA DE SOFTWARE</small></p>
    <p class="lead" style="margin-top:50px;max-width:820px">Tecnologia que parece simples, feita sob medida para o seu negócio.</p>
    <p class="handle">@aure.tii</p>
    <p id="follow">Seguir</p>
  </div>
  <div id="cursor"></div>
</div>
<script>
  const A = "../../../your-dream-website/src/assets/";
  const shots = ["../../posts/2026-10-19/2026-10-19.png", "../../posts/2026-10-19/2026-10-20-camisas-mockup.png", "../../posts/2026-10-19/2026-10-23.png",
    "../post-english-mockup.png", A + "sistema-hp.webp", "../../posts/2026-10-19/2026-10-21.png"];
  const pos = [[60, 640], [580, 560], [60, 1230], [580, 1150], [320, 1760], [-180, 1760]];
  shots.forEach((src, i) => { const d = document.createElement("div"); d.className = "tile"; d.innerHTML = `<img src="${src}">`; d.style.left = pos[i][0] + "px"; d.style.top = pos[i][1] + "px"; $("#wall").appendChild(d); });
  const tiles = $$(".tile"), beats = ["#b1", "#b2", "#b3", "#b4"].map($);
  scene(15, t => {
    // intro line types itself by revealing left to right
    $("#b0").style.clipPath = `inset(0 ${100 - E.out(seg(t, .1, 1.1)) * 100}% 0 0)`;
    css($("#b0 p"), { s: 1 + .05 * seg(t, 0, 2.4) });
    // beats: each word cuts in with an iris and a punch
    beats.forEach((b, i) => {
      const a = 2.4 + i * .65, u = E.out(seg(t, a, a + .3));
      b.style.clipPath = `circle(${Math.max(1, u * 1300)}px at ${i % 2 ? 900 : 180}px ${i % 2 ? 1700 : 220}px)`;
      css(b.firstElementChild, { s: 1.25 - .25 * E.out(seg(t, a, a + .5)), y: 30 * (1 - u) });
    });
    css($("#bar"), { o: seg(t, 2.4, 2.5) * (1 - seg(t, 5.0, 5.1)) }); $("#bar").style.transform = `scaleX(${seg(t, 2.4, 5.0)})`;
    // wall of real projects slides up, tiles flip in one by one
    $("#wall").style.clipPath = `inset(${100 - E.inOut(seg(t, 5.0, 5.6)) * 100}% 0 0 0)`;
    rise($("#wallt"), seg(t, 5.4, 6), 60);
    const drift = seg(t, 5.2, 11) * -180;
    tiles.forEach((d, i) => { const u = E.back(seg(t, 5.6 + i * .25, 6.2 + i * .25)); d.style.transform = `translateY(${drift}px) rotateY(${(1 - Math.min(u, 1)) * 90}deg) rotate(${i % 2 ? 3 : -3}deg) scale(${.6 + .4 * Math.min(u, 1.05)})`; d.style.opacity = seg(t, 5.6 + i * .25, 5.8 + i * .25); });
    // end: logo, line, follow button gets "tapped"
    $("#end").style.clipPath = `circle(${Math.max(1, E.inOut(seg(t, 10.6, 11.4)) * 1300)}px at 540px 960px)`;
    $$("#end > *").forEach((e, i) => rise(e, seg(t, 11 + i * .15, 11.6 + i * .15), 50));
    const tap = seg(t, 13.2, 13.5), done = t > 13.4;
    $("#follow").textContent = done ? "Seguindo" : "Seguir";
    $("#follow").style.background = done ? "#2b2f3a" : "#4f5bd5";
    css($("#follow"), { s: 1 - .08 * Math.sin(Math.PI * tap), y: 0, o: seg(t, 11.6, 12) });
    css($("#cursor"), { x: (1 - E.out(seg(t, 12.4, 13.2))) * 260, y: (1 - E.out(seg(t, 12.4, 13.2))) * 200 - 255, s: 1 - .2 * Math.sin(Math.PI * tap), o: seg(t, 12.4, 12.6) * (1 - seg(t, 14, 14.3)) });
  });
</script>
</body></html>
